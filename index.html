  --btn-bg:rgba(71,85,105,.35);

html{scroll-behavior:smooth}

<script>
/* ============================================================
   ANTI-ZOOM & UTILITIES
   ============================================================ */
document.addEventListener('gesturestart', e => e.preventDefault(), {passive:false});
document.addEventListener('gesturechange', e => e.preventDefault(), {passive:false});
document.addEventListener('gestureend', e => e.preventDefault(), {passive:false});
document.addEventListener('touchstart', e => { if(e.touches.length > 1) e.preventDefault(); }, {passive:false});

let lastTouch = 0;
document.addEventListener('touchend', e => {
  const now = Date.now();
  if(now - lastTouch <= 300){ e.preventDefault(); }
  lastTouch = now;
}, {passive:false});

document.addEventListener('wheel', e => { if(e.ctrlKey) e.preventDefault(); }, {passive:false});
document.addEventListener('keydown', e => {
  if((e.ctrlKey || e.metaKey) && (e.key === '+' || e.key === '-' || e.key === '=' || e.key === '0')) e.preventDefault();
});

/* ============================================================
   DARK MODE
   ============================================================ */
function toggleTheme(){
  document.body.classList.toggle('dark');
  const isDark = document.body.classList.contains('dark');
  try{ localStorage.setItem('theme', isDark ? 'dark' : 'light'); }catch(e){}
  const btn = document.getElementById('theme-btn');
  if(btn) btn.textContent = isDark ? '☀️' : '🌙';
}
(function(){
  try{
    const saved = localStorage.getItem('theme');
    if(saved === 'dark'){ document.body.classList.add('dark'); }
  }catch(e){}
})();

/* ============================================================
   ROUTER
   ============================================================ */
const routes = {};
function navigate(page){ location.hash = page; }
function goBack(){
  if(window.history.length > 1 && document.referrer !== ''){ window.history.back(); }
  else { navigate('home'); }
}
function render(){
  const page = (location.hash.replace('#','') || 'home');
  const fn = routes[page] || routes.home;
  try{
    document.getElementById('app').innerHTML = fn();
  }catch(err){
    console.error('Render error:', err);
    document.getElementById('app').innerHTML = '<h1>Terjadi kesalahan</h1><p>Silakan refresh halaman.</p>';
    return;
  }
  const btn = document.getElementById('theme-btn');
  if(btn) btn.textContent = document.body.classList.contains('dark') ? '☀️' : '🌙';

  const meta = {
    home:{t:'Kalkulator Serbaguna Online - 40+ Kalkulator Gratis & Akurat',d:'Kumpulan kalkulator online gratis: zakat, KPR, BMI, kalori, IPK, diskon, PPN, dan lainnya.'},

    zakat:{t:'Kalkulator Zakat Online - Zakat Fitrah & Mal',d:'Kalkulator zakat online gratis.'},
    kpr:{t:'Kalkulator KPR - Simulasi Cicilan Rumah',d:'Kalkulator KPR online gratis.'},
    kalori:{t:'Kalkulator Kalori Harian - Hitung Kebutuhan Kalori',d:'Kalkulator kalori online gratis.'},
    bmr:{t:'Kalkulator BMR - Basal Metabolic Rate',d:'Kalkulator BMR online gratis.'},
    diskon:{t:'Kalkulator Diskon - Hitung Harga Setelah Potongan',d:'Kalkulator diskon online gratis.'},
    ppn:{t:'Kalkulator PPN 11% - Hitung Pajak Pertambahan Nilai',d:'Kalkulator PPN online gratis.'},
    bunga:{t:'Kalkulator Bunga - Bunga Tunggal & Majemuk',d:'Kalkulator bunga online gratis.'},
    usia:{t:'Kalkulator Usia - Hitung Umur Akurat',d:'Kalkulator usia online gratis.'},
    'selisih-hari':{t:'Kalkulator Selisih Hari - Beda 2 Tanggal',d:'Kalkulator selisih hari online gratis.'},
    ipk:{t:'Kalkulator IPK - Hitung Nilai Kuliah',d:'Kalkulator IPK online gratis.'},
    pecahan:{t:'Kalkulator Pecahan - Operasi Pecahan Online',d:'Kalkulator pecahan online gratis.'},
    persen:{t:'Kalkulator Persen - Hitung Persentase Online',d:'Kalkulator persen online gratis.'},
    akar:{t:'Kalkulator Akar - Akar Kuadrat & Kubik',d:'Kalkulator akar online gratis.'},
    warisan:{t:'Kalkulator Warisan Islam - Pembagian Waris',d:'Kalkulator warisan online gratis.'},
    tentang:{t:'Tentang - Kalkulator Serbaguna',d:'Tentang website.'},
    privacy:{t:'Privacy Policy - Kalkulator Serbaguna',d:'Kebijakan privasi.'}
  };
  document.title = (meta[page]?.t) || meta.home.t;

  if(page==='ipk') initIPK();
  if(page==='persen') ubahModePersen();
  if(page==='zakat') toggleZakat();
  if(page==='konversi-suhu') initSuhu();
  if(page==='konversi-panjang') initPanjang();
  if(page==='konversi-berat') initBerat();

  window.scrollTo({top:0,behavior:'smooth'});
}
window.addEventListener('hashchange', render);

/* ============================================================

const num = id => { const el = document.getElementById(id); return el ? (parseFloat(el.value) || 0) : 0; };
const val = id => { const el = document.getElementById(id); return el ? el.value : ''; };
const tampil = (id, html) => {
  const el = document.getElementById(id);
  if(!el) return;
  el.innerHTML = html;
  el.classList.add('show');
  el.scrollIntoView({behavior:'smooth',block:'center'});
};

  return `<a class="kartu-link" data-nama="${(nama+' '+desk).toLowerCase()}" onclick="navigate('${page}')">

function filterKalkulator(q){
  q = (q||'').toLowerCase().trim();
  document.querySelectorAll('.kartu-link').forEach(k => {
    const match = !q || k.dataset.nama.includes(q);
    k.classList.toggle('hidden', !match);
  });
  document.querySelectorAll('.kategori').forEach(sec => {
    const visible = sec.querySelectorAll('.kartu-link:not(.hidden)').length;
    sec.style.display = visible ? '' : 'none';
  });
}

function hitungBMI(e){
  e.preventDefault();
  const t = num('bmi-tinggi')/100, b = num('bmi-berat');
  if(t<=0||b<=0){ alert('Isi tinggi & berat dengan benar'); return; }
  const bmi = b/(t*t);
  let kat,kelas;
  if(bmi<18.5){kat='Kurus (Underweight)';kelas='warn'}
  else if(bmi<25){kat='Normal (Ideal)';kelas='ok'}
  else if(bmi<30){kat='Kelebihan Berat';kelas='warn'}
  else{kat='Obesitas';kelas='warn'}
  tampil('hasil-bmi',`<p>BMI Anda: <strong>${bmi.toFixed(2)}</strong></p><p>Kategori: <span class="${kelas}">${kat}</span></p><p class="small">BMI normal: 18.5 – 24.9</p>`);
}

      <label>Berat Emas (gram)<input type="number" id="zakat-berat-emas" placeholder="100" step="0.1"></label>
      <label>Harga Emas per gram (Rp)<input type="number" id="zakat-emas3" value="1200000"></label>
    </div>
    <button type="submit">Hitung Zakat</button>
  </form>
  <div class="hasil" id="hasil-zakat"></div>
</div>
<h2>Jenis Zakat</h2>
<ul>
  <li><strong>Zakat Fitrah:</strong> 2,5 kg beras per jiwa sebelum Idul Fitri</li>
  <li><strong>Zakat Mal:</strong> 2,5% dari harta yang mencapai nisab (85 gr emas)</li>
  <li><strong>Zakat Penghasilan:</strong> 2,5% dari gaji jika mencapai nisab</li>
  <li><strong>Zakat Emas:</strong> 2,5% dari emas yang mencapai 85 gram</li>
</ul>
${terkait([['warisan','Kalkulator Warisan'],['bunga','Kalkulator Bunga'],['persen','Kalkulator Persen']])}
`;
function toggleZakat(){
  const jenis = val('zakat-jenis');
  const fields = {
    fitrah: 'zakat-fitrah-fields',
    mal: 'zakat-mal-fields',
    penghasilan: 'zakat-penghasilan-fields',
    emas: 'zakat-emas-fields'
  };
  Object.values(fields).forEach(id => document.getElementById(id)?.classList.add('hidden'));
  document.getElementById(fields[jenis])?.classList.remove('hidden');
}
function hitungZakat(e){
  e.preventDefault();
  const jenis = val('zakat-jenis');
  let zakat=0, ket='';
  if(jenis==='fitrah'){
    const jiwa = num('zakat-jiwa')||1, beras = num('zakat-beras')||15000;
    zakat = jiwa*2.5*beras;
    ket = `${jiwa} jiwa × 2,5 kg × ${rupiah(beras)}/kg`;
  } else if(jenis==='mal'){
    const harta = num('zakat-harta'), hargaEmas = num('zakat-emas')||1200000;
    const nisab = 85*hargaEmas;
    if(harta>=nisab){ zakat = harta*0.025; ket = `Harta ≥ nisab ${rupiah(nisab)} → wajib 2,5%`; }
    else { ket = `Harta ${rupiah(harta)} < nisab ${rupiah(nisab)} → belum wajib zakat`; }
  } else if(jenis==='penghasilan'){
    const gaji = num('zakat-gaji'), hargaEmas = num('zakat-emas2')||1200000;
    const nisabBulan = (85*hargaEmas)/12;
    if(gaji>=nisabBulan){ zakat = gaji*0.025; ket = `Gaji ≥ nisab bulanan ${rupiah(nisabBulan)} → wajib 2,5%`; }
    else { ket = `Gaji ${rupiah(gaji)} < nisab bulanan ${rupiah(nisabBulan)} → belum wajib zakat`; }
  } else {
    const berat = num('zakat-berat-emas'), hargaEmas = num('zakat-emas3')||1200000;
    if(berat>=85){ zakat = berat*hargaEmas*0.025; ket = `${berat} gram ≥ 85 gram → wajib zakat 2,5%`; }
    else { ket = `${berat} gram < 85 gram → belum wajib zakat`; }
  }
  tampil('hasil-zakat',`<p>Zakat yang wajib dibayar:</p><p><strong>${rupiah(zakat)}</strong></p><p class="small">${ket}</p>`);
}

routes.kpr = () => `
${breadcrumb('Kalkulator KPR','💰 Keuangan')}
<h1>Kalkulator KPR - Simulasi Cicilan Rumah</h1>
<p class="lead">Hitung cicilan KPR bulanan berdasarkan pokok pinjaman, bunga, dan tenor.</p>
<div class="card">
  <form onsubmit="hitungKPR(event)">
    <label>Jumlah Pinjaman (Rp)<input type="number" id="kpr-pokok" placeholder="500000000" required></label>
    <label>Bunga per Tahun (%)<input type="number" id="kpr-bunga" placeholder="8.5" step="0.01" required></label>
    <label>Tenor (tahun)<input type="number" id="kpr-tenor" placeholder="15" required></label>
    <button type="submit">Hitung Cicilan</button>
  </form>
  <div class="hasil" id="hasil-kpr"></div>
</div>
<h2>Rumus Cicilan KPR</h2>
<p><strong>Cicilan = [P × i] ÷ [1 − (1+i)<sup>−n</sup>]</strong></p>
<h2>Tips Mengambil KPR</h2>
<ul>
  <li>Cicilan ideal ≤ 30% penghasilan bulanan</li>
  <li>Perhatikan bunga fixed vs floating</li>
  <li>Siapkan DP minimal 20%</li>
</ul>
${terkait([['bunga','Kalkulator Bunga'],['diskon','Kalkulator Diskon'],['ppn','Kalkulator PPN']])}
`;
function hitungKPR(e){
  e.preventDefault();
  const p = num('kpr-pokok'), i = num('kpr-bunga')/100/12, n = num('kpr-tenor')*12;
  if(p<=0||n<=0){ alert('Isi data dengan benar'); return; }
  const c = i===0 ? p/n : (p*i)/(1-Math.pow(1+i,-n));
  const total = c*n, bunga = total-p;
  tampil('hasil-kpr',`<p>Cicilan per bulan: <strong>${rupiah(c)}</strong></p><p>Total pembayaran: ${rupiah(total)}</p><p>Total bunga: ${rupiah(bunga)}</p>`);
}

      <option value="+">Penjumlahan (+)</option>
      <option value="-">Pengurangan (−)</option>
      <option value="*">Perkalian (×)</option>
      <option value="/">Pembagian (÷)</option>
    </select></label>
    <button type="submit">Hitung</button>
  </form>
  <div class="hasil" id="hasil-pecahan"></div>
</div>
${terkait([['persen','Kalkulator Persen'],['akar','Kalkulator Akar']])}

function hitungPecahan(e){
  e.preventDefault();
  const a=num('pec-a'),b=num('pec-b'),c=num('pec-c'),d=num('pec-d'),op=val('pec-op');
  if(b===0||d===0){ alert('Penyebut tidak boleh 0'); return; }
  let p,q,langkah;
  if(op==='+'){p=a*d+c*b;q=b*d;langkah=`${a}/${b} + ${c}/${d}`}
  else if(op==='-'){p=a*d-c*b;q=b*d;langkah=`${a}/${b} − ${c}/${d}`}
  else if(op==='*'){p=a*c;q=b*d;langkah=`${a}/${b} × ${c}/${d}`}
  else{p=a*d;q=b*c;langkah=`${a}/${b} ÷ ${c}/${d}`}
  if(q===0){ alert('Hasil tidak valid'); return; }
  const fpb=(x,y)=>y===0?Math.abs(x):fpb(y,x%y);
  const g=fpb(p,q)||1, sp=p/g, sq=q/g;
  const fsp = sq<0 ? -sp : sp, fsq = Math.abs(sq);
  tampil('hasil-pecahan',`<p>Hasil: <strong>${fsp}/${fsq}</strong></p><p class="small">${langkah} = ${p}/${q} = ${fsp}/${fsq} = ${(p/q).toFixed(4)}</p>`);
}

function hitungPPh(e){
  e.preventDefault();
  const gaji = num('pph-gaji'), ptkp = num('pph-ptkp');
  const bruto = gaji*12;
  const pkp = Math.max(0, bruto - ptkp);
  let pajak = 0;
  const brackets = [[60000000,0.05],[190000000,0.15],[250000000,0.25],[4500000000,0.30],[Infinity,0.35]];
  let sisa = pkp, prev = 0;
  for(const [max, rate] of brackets){
    if(sisa<=0) break;
    const range = Math.min(sisa, max-prev);
    pajak += range*rate;
    sisa -= range;
    prev = max;
  }
  tampil('hasil-pph',`<p>PKP: ${rupiah(pkp)}</p><p>PPh 21 per Tahun: <strong>${rupiah(pajak)}</strong></p><p>PPh 21 per Bulan: ${rupiah(pajak/12)}</p><p class="small">Gaji bersih: ${rupiah(gaji-pajak/12)}/bulan</p>`);
}

${terkait([['standar-deviasi','Standar Deviasi'],['ipk','IPK']])}

function hitungStat(){
  const raw = val('stat-data');
  const data = raw.split(/[,\s]+/).map(x=>parseFloat(x)).filter(x=>!isNaN(x));
  if(data.length===0){ alert('Isi data angka'); return; }
  data.sort((a,b)=>a-b);
  const n = data.length;
  const mean = data.reduce((a,b)=>a+b,0)/n;
  const median = n%2 ? data[(n-1)/2] : (data[n/2-1]+data[n/2])/2;
  const freq = {};
  data.forEach(x=>freq[x]=(freq[x]||0)+1);
  let modus = [], maxF = 0;
  for(const k in freq){ if(freq[k]>maxF){ maxF=freq[k]; modus=[k]; } else if(freq[k]===maxF) modus.push(k); }
  const min = data[0], max = data[n-1];
  const range = max-min;
  tampil('hasil-stat',`
    <p>Jumlah data: ${n}</p>
    <p>Mean: <strong>${mean.toFixed(4)}</strong></p>
    <p>Median: <strong>${median.toFixed(4)}</strong></p>
    <p>Modus: <strong>${modus.join(', ')}</strong> (muncul ${maxF}×)</p>
    <p>Min: ${min} · Max: ${max} · Range: ${range}</p>
  `);
}

function hitungSD(){

  const n = data.length;

function hitungWarna(e){

  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  const rn=r/255, gn=g/255, bn=b/255;
  const max = Math.max(rn,gn,bn), min = Math.min(rn,gn,bn);
  let h=0, s=0, l=(max+min)/2;
  if(max!==min){
    const d = max-min;
    s = l>0.5 ? d/(2-max-min) : d/(max+min);
    if(max===rn) h = ((gn-bn)/d+(gn<bn?6:0))/6;
    else if(max===gn) h = ((bn-rn)/d+2)/6;
    else h = ((rn-gn)/d+4)/6;
  }
  h = Math.round(h*360); s = Math.round(s*100); l = Math.round(l*100);
  tampil('hasil-wr',`
    <div style="width:100%;height:80px;background:${hex};border-radius:12px;margin-bottom:14px;border:1px solid var(--border)"></div>
    <p>HEX: <strong>${hex.toUpperCase()}</strong></p>
    <p>RGB: <strong>rgb(${r}, ${g}, ${b})</strong></p>
    <p>HSL: <strong>hsl(${h}, ${s}%, ${l}%)</strong></p>
  `);
}
